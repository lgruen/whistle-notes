<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch/home indicator;
         the CSS pays that back with env(safe-area-inset-*) padding. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Two theme-colors: the installed app is dark, but a light-mode browser
         chrome should not get a black address bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="description" content="Whistle a melody, see the piano notes to play" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Whistle" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <title>Whistle Notes</title>
  </head>
  <body>
    <!-- Single screen, thumb-first: everything that reports lives in the
         scrolling middle, everything that acts lives in the fixed dock at the
         bottom where a thumb actually reaches. -->
    <header class="header">
      <span class="brand">Whistle&nbsp;Notes</span>
      <!-- Display octave. Whistling sits one to two octaves above the treble
           staff, so this is nearly always -1 or -2; it changes what is drawn
           and played, never what was heard. -->
      <div class="octave" id="transpose" role="group" aria-label="Display octave">
        <button type="button" data-transpose="0" aria-pressed="false">0</button>
        <button type="button" data-transpose="-1" aria-pressed="false">−1</button>
        <button type="button" data-transpose="-2" aria-pressed="false">−2</button>
      </div>
    </header>

    <main class="app">
      <section class="live">
        <div class="live-note" id="live-note" aria-live="off">—</div>
        <div class="cents" aria-hidden="true">
          <span class="cents-center"></span>
          <span class="cents-needle" id="live-needle"></span>
        </div>
        <div class="meter" aria-hidden="true">
          <span class="meter-fill" id="live-level"></span>
        </div>
        <p class="hint" id="live-hint">Tap Record and whistle a melody.</p>
        <p class="clock" id="live-time"></p>
      </section>

      <p class="message" id="message" hidden></p>
      <!-- "You whistled a quarter-tone sharp all the way through, and here is
           the A that implies" — shown only when the segmenter actually had to
           correct for it. -->
      <p class="tuning" id="tuning" hidden></p>

      <canvas class="roll" id="roll" aria-label="Pitch over time"></canvas>
      <div class="notes" id="notelist" hidden></div>
      <div class="staff" id="staff" hidden></div>

      <footer class="footer">
        <span id="build-stamp"></span>
      </footer>
    </main>

    <div class="dock">
      <button type="button" class="btn btn-record" id="record">Record</button>
      <button type="button" class="btn btn-play" id="play" hidden>Play</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
