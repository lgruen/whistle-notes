<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon source. Everything visible lives inside the centred 80%-diameter
  circle (r = 205 on this 512 canvas) so that Android's maskable crop — which
  may be a circle, a squircle or a teardrop — can never clip the artwork.
  The rounded-rect background is full-bleed apart from its corners; the
  maskable PNG is flattened onto the same colour so the crop finds paint
  everywhere it looks. Regenerate the PNGs with `npm run icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>

  <!-- Nudged so the ink's bounding box, not the canvas, sits at the centre. -->
  <g transform="translate(-8,-12)">
    <!-- Whistle: three sound waves fading as they travel outward. -->
    <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
      <path d="M 115.5 228.1 A 34 34 0 0 1 115.5 283.9" opacity="0.9"/>
      <path d="M 131.6 205.2 A 62 62 0 0 1 131.6 306.8" opacity="0.6"/>
      <path d="M 147.6 182.3 A 90 90 0 0 1 147.6 329.7" opacity="0.35"/>
    </g>

    <!-- Eighth note: notehead tilted the way a real one is engraved. -->
    <g fill="#ffffff">
      <ellipse cx="300" cy="330" rx="52" ry="38" transform="rotate(-20 300 330)"/>
      <rect x="344" y="168" width="15" height="167"/>
      <path d="M 347 168 C 400 186, 424 220, 400 268 C 414 224, 392 206, 347 214 Z"/>
    </g>
  </g>
</svg>
